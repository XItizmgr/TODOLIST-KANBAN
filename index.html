<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo list</title>
    <link rel="stylesheet" href="style.css" />  
  </head>
  <body>
    <main>
      <nav>
        <h1>Todo List</h1>
        <button class="New-taskAddingBtn">Add New Task</button>
      </nav>
      <section id="section-first">
        <div id="todo" class="Task-colum">
          
            <div class="Header-todo">
              <h1>To-Do</h1>
              <h1 class="count">Count</h1>
            </div>
         
          
        </div>
        <div id="progress" class="Task-colum">
            <div class="Header-todo">
              <h1>Progress</h1>
              <h1 class="count">Count</h1>
            </div>
        </div>
        <div id="complete" class="Task-colum">
             <div class="Task-list" >
            <div class="Header-todo">
              <h1>Complete</h1>
              <h1 class="count">Count</h1>
            </div>
            </div>
        </div>
      </section>
      <section class="modal">
        <div class="bg">
        <form action="">
          <input type="text" placeholder="Task Title" id="task-title"/>
          <textarea placeholder="Task discription" id="task-discription"></textarea>
          <button class="add-newTask" id="newTaskadding" type="button">Add Task</button>
        </form>
        </div>
      </section>

    </main>
    
    <script src="./script.js"></script>
  </body>
</html>
